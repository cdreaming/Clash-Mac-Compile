name: Build macOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ClashmacOS (Apple Silicon arm64 · Unsigned)
    runs-on: xcode-27
    timeout-minutes: 240

    steps:
      - name: Checkout build project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Check toolchain and project configuration
        run: |
          xcodebuild -version
          go version
          python3 --version
          xcodegen --version
          python3 scripts/check-build-config.py

      - name: Build native macOS app
        env:
          CLASH_BUILD_JOBS: "2"
          CLASH_SWIFT_OPTIMIZATION_LEVEL: "-O"
        run: |
          bash scripts/build-macos-app.sh --output build/ci

      - name: Resolve artifact name
        id: version
        shell: bash
        run: |
          echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS app
        uses: actions/upload-artifact@v6
        with:
          name: Clash_Mac_Compile-v${{ steps.version.outputs.value }}-macos-arm64-unsigned-${{ github.sha }}
          path: |
            build/ci/Clash_Mac_Compile-v${{ steps.version.outputs.value }}-macos-arm64-unsigned.zip
            build/ci/BUILD-METADATA.json
            build/ci/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
