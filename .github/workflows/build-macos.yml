name: Build macOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ClashmacOS (Apple Silicon arm64 · Unsigned)
    runs-on: xcode-27
    timeout-minutes: 240

    steps:
      - name: Checkout build project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          check-latest: false
          cache: false

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Check toolchain and project configuration
        run: |
          xcodebuild -version
          go version
          python3 --version
          xcodegen --version
          python3 scripts/check-build-config.py

      - name: Build and verify native macOS app
        id: build_app
        shell: bash
        env:
          CLASH_BUILD_JOBS: "2"
          CLASH_SWIFT_OPTIMIZATION_LEVEL: "-O"
          CLASH_SIGNING_MODE: "unsigned"
          BUILD_OUTPUT_DIR: ${{ github.workspace }}/build/ci
        run: |
          set -Eeuo pipefail
          mkdir -p "$BUILD_OUTPUT_DIR"
          printf 'status=started\\noutput_directory=%s\\n' "$BUILD_OUTPUT_DIR" > "$BUILD_OUTPUT_DIR/BUILD-WORKFLOW-STATUS.txt"
          printf 'workspace=%s\\nworking_directory=%s\\noutput_directory=%s\\nversion=%s\\n' \\
            "$GITHUB_WORKSPACE" "$PWD" "$BUILD_OUTPUT_DIR" "$(tr -d '[:space:]' < VERSION)" \\
            > "$BUILD_OUTPUT_DIR/BUILD-WORKFLOW-CONTEXT.txt"
          record_build_workflow_status() {
            local status_code=$?
            trap - EXIT
            local status_name=failed
            if [[ "$status_code" -eq 0 ]]; then status_name=success; fi
            printf 'status=%s\\nexit_code=%s\\noutput_directory=%s\\n' \\
              "$status_name" "$status_code" "$BUILD_OUTPUT_DIR" \\
              > "$BUILD_OUTPUT_DIR/BUILD-WORKFLOW-STATUS.txt"
            exit "$status_code"
          }
          trap record_build_workflow_status EXIT
          echo "GitHub workspace: $GITHUB_WORKSPACE"
          echo "Build output directory: $BUILD_OUTPUT_DIR"
          bash scripts/build-macos-app.sh --output "$BUILD_OUTPUT_DIR"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 scripts/verify-build-outputs.py --directory "$BUILD_OUTPUT_DIR" --version "$VERSION" --mode unsigned

      - name: Report build outcome and output directory
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build_app.outcome }}
          BUILD_OUTPUT_DIR: ${{ github.workspace }}/build/ci
        shell: bash
        run: |
          echo "Build step outcome: $BUILD_OUTCOME"
          echo "Build output directory: $BUILD_OUTPUT_DIR"
          if [[ -d "$BUILD_OUTPUT_DIR" ]]; then
            find "$BUILD_OUTPUT_DIR" -maxdepth 3 -type f -print
          else
            echo "Build output directory was not created."
          fi
          for status_file in BUILD-WORKFLOW-STATUS.txt BUILD-SCRIPT-STATUS.txt BUILD-RUN-CONTEXT.txt BUILD-WORKFLOW-CONTEXT.txt; do
            if [[ -f "$BUILD_OUTPUT_DIR/$status_file" ]]; then
              echo "==> $status_file"
              cat "$BUILD_OUTPUT_DIR/$status_file"
            fi
          done

      - name: Upload Xcode linker diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Clash_Mac_Compile-linker-diagnostics-${{ github.run_id }}
          path: |
            build/ci/XCODEBUILD.log
            build/ci/LINKER-DIAGNOSTICS.txt
            build/ci/XCODEBUILD-EXIT-CODE.txt
            build/ci/ClashmacOSExtension-BuildSettings.json
            build/ci/ClashmacOSExtension-BuildSettings.stderr.log
            build/ci/ClashClient-project.system-extension.yml
            build/ci/BUILD-SCRIPT-STATUS.txt
            build/ci/BUILD-RUN-CONTEXT.txt
            build/ci/BUILD-WORKFLOW-STATUS.txt
            build/ci/BUILD-WORKFLOW-CONTEXT.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Resolve artifact name
        id: version
        shell: bash
        run: |
          echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS app
        if: steps.build_app.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: Clash_Mac_Compile-v${{ steps.version.outputs.value }}-macos-arm64-unsigned-${{ github.sha }}
          path: build/ci/
          if-no-files-found: error
          retention-days: 14
